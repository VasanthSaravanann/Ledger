[package]
name = "ledger"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Operational tooling for the v1 manual candidate feedback pilot"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
ed25519-dalek = "2"
fs2 = "0.4"
getrandom = "0.2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"

# The web workspace is optional: `cargo build` stays the offline CLI, and the
# server-only dependencies are absent unless `--features ui` is passed.
axum = { version = "0.8", optional = true, default-features = false, features = [
  "http1",
  "json",
  "query",
  "form",
  "tokio",
] }
tokio = { version = "1", optional = true, features = [
  "rt-multi-thread",
  "macros",
  "net",
] }

[features]
default = []
ui = ["dep:axum", "dep:tokio"]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

# V4 6.1: no unwrap, no panic!, no slice indexing outside tests. `expect` is
# deliberately NOT denied; it is confined to const-initialisation sites listed in
# README.md ("Documented expects") and each site carries a justification comment.
[lints.clippy]
unwrap_used = "deny"
panic = "deny"
indexing_slicing = "deny"
