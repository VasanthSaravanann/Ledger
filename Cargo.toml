[package]
name = "ledger"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Operational tooling for the v1 manual candidate feedback pilot"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
