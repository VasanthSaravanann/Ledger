name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 03:00 UTC: the heavy tools run here, never per-PR.
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Site drift check
        run: |
          ./scripts/build-site.sh
          git diff --exit-code -- site

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The declared MSRV is a claim, so it gets compiled, not just declared.
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo build --locked --all-targets
      - run: cargo test --locked --no-run

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans advisories licenses sources

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Per-module floors (coverage-floors.toml), not a global percentage.
      - run: cargo llvm-cov --locked --lcov --output-path lcov.info
      - run: ./scripts/coverage-floors.sh lcov.info

  mutants:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-mutants
      # Scoped deliberately: a full 5k-line run costs hours and finds little.
      - run: |
          cargo mutants --no-shuffle --timeout 120 \
            --file src/digest.rs --file src/log.rs --file src/pipeline.rs \
            --file src/metrics.rs --file src/qa.rs --file src/template.rs

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - run: cargo fuzz run parse_csv -- -max_total_time=60
      - run: cargo fuzz run parse_log -- -max_total_time=60
