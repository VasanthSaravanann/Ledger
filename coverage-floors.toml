# Per-module line-coverage floors for the modules V4 names. A single global
# percentage rewards testing trivial code; these floors only rise.
#
# They were baselined from the first CI run (pipeline 69, metrics 80, template 61)
# and set five points below the measured value so the gate fails on a regression
# rather than on unrelated churn. CONTRIBUTING.md records why each is where it is
# and what has to happen for it to rise.
#
#   digest       canonical encoder: a wrong byte silently breaks every digest
#   log          chain verification and framing
#   pipeline     the three circuit-breakers
#   metrics      the five pre-registered bands
#   qa           the deterministic sample
#   template     slot resolution and Template A/B/C rules
[floors]
"src/digest.rs" = 80
"src/log.rs" = 70
"src/pipeline.rs" = 65
"src/metrics.rs" = 75
"src/qa.rs" = 80
"src/template.rs" = 58
