# V4 7.1: a static, portable assertion that nothing in the tree can open a socket.
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
# Network-capable crates. The pilot is an offline CLI: it renders text and appends
# to local files, so none of these has any business in the graph.
deny = [
  { name = "reqwest", reason = "offline CLI: no HTTP client" },
  { name = "hyper", reason = "offline CLI: no HTTP client" },
  { name = "h2", reason = "offline CLI: no HTTP client" },
  { name = "ureq", reason = "offline CLI: no HTTP client" },
  { name = "isahc", reason = "offline CLI: no HTTP client" },
  { name = "surf", reason = "offline CLI: no HTTP client" },
  { name = "awc", reason = "offline CLI: no HTTP client" },
  { name = "curl", reason = "offline CLI: no HTTP client" },
  { name = "tonic", reason = "offline CLI: no gRPC" },
  { name = "quinn", reason = "offline CLI: no QUIC" },
  { name = "tokio-tungstenite", reason = "offline CLI: no websockets" },
  { name = "rustls", reason = "offline CLI: no TLS" },
  { name = "native-tls", reason = "offline CLI: no TLS" },
  { name = "openssl", reason = "offline CLI: no TLS" },
  { name = "openssl-sys", reason = "offline CLI: no TLS" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
